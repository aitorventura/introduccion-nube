<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Coste mensual de una función Lambda frente a una instancia t3.small</title>
<desc id="d">Gráfico logarítmico: el coste de Lambda crece con las invocaciones y corta la línea fija de la instancia (15,18 dólares) en unos 8 millones de invocaciones al mes, o unos 5 millones con la pasarela de API.</desc>
